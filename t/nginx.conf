# Test configuration for t/test.sh.

load_module modules/ngx_http_health_check_module.so;

worker_processes 4;             # checks run in worker 0, the others must see them
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;

    # --- backends -----------------------------------------------------------
    # 127.0.0.1:9101 and :9102 answer "/" with their port; 127.0.0.1-3:9201
    # (the "resolve" group) with their address. That port or address is the
    # backend's key. 127.0.0.1:9401 and :9402 are the same over https, for
    # tls.test (certificate from test-ca); 9401 needs SNI tls.test, see the
    # server after this one. Their answers are switched by files in /tmp/hc/:
    #   /health    <key>.fail      503 "fail"
    #              <key>.degraded  200 "degraded"
    #              <key>.html      200 "ok" as text/html
    #              (none)          200 "ok" as text/plain
    #   /ready     <key>.unready   503
    # /health11 is /health for HTTP/1.1 and 426 for HTTP/1.0, as Envoy does.
    # /flaky always answers 503, to count proxy_next_upstream attempts.

    map $server_port $hc_key {
        9201     $server_addr;
        default  $server_port;
    }

    server {
        listen 127.0.0.1:9101;
        listen 127.0.0.1:9102;
        listen 127.0.0.1:9201;
        listen 127.0.0.2:9201;
        listen 127.0.0.3:9201;
        listen 127.0.0.1:9401 ssl;
        listen 127.0.0.1:9402 ssl;
        server_name tls.test;
        ssl_certificate certs/tls.crt;
        ssl_certificate_key certs/tls.key;
        default_type text/plain;

        location = /health {
            if (-f /tmp/hc/$hc_key.fail)     { return 503 "fail\n"; }
            if (-f /tmp/hc/$hc_key.degraded) { return 200 "degraded\n"; }
            if (-f /tmp/hc/$hc_key.html)     { rewrite ^ /health-html last; }
            return 200 "ok\n";
        }

        location = /health11 {
            if ($server_protocol != "HTTP/1.1") { return 426; }
            rewrite ^ /health last;
        }

        location = /health-html {
            internal;
            default_type text/html;
            return 200 "ok\n";
        }

        location = /ready {
            if (-f /tmp/hc/$hc_key.unready) { return 503; }
            return 200 "ok\n";
        }

        location = /flaky {
            return 503 "$hc_key\n";
        }

        location / {
            return 200 "$hc_key\n";
        }
    }

    # Handshakes on 127.0.0.1:9401 without SNI tls.test.
    server {
        listen 127.0.0.1:9401 ssl default_server;
        ssl_reject_handshake on;
    }

    # 127.0.0.4:9201 is the target of the SRV record _http._tcp.srv.test
    # (a.srv.test, from dnsmasq). It logs the /health requests it gets.
    server {
        listen 127.0.0.4:9201;
        default_type text/plain;

        location = /health {
            access_log /tmp/srv-health.log;
            return 200 "ok\n";
        }

        location / {
            return 200 "127.0.0.4\n";
        }
    }

    # socat (see entrypoint.sh): 127.0.0.1:9301 answers every request with
    # the bytes of /tmp/raw/resp, whatever they are; 127.0.0.1:9302 accepts
    # connections and never answers.

    # --- groups ---------------------------------------------------------------
    # 256k: the zone minimum is above 64k on systems with 16k memory pages.

    # hc_default and hc_dns also serve /flaky/, whose 503s would trip the
    # passive checks (max_fails) and take servers out on their own.

    upstream hc_default {           # health_check uri=/health
        zone hc_default 256k;
        server 127.0.0.1:9101 max_fails=0;
        server 127.0.0.1:9102 max_fails=0;
    }

    upstream hc_match {             # health_check uri=/health match=hc_ok
        zone hc_match 256k;
        server 127.0.0.1:9101;
        server 127.0.0.1:9102;
    }

    upstream hc_neg {               # health_check uri=/health match=hc_neg
        zone hc_neg 256k;
        server 127.0.0.1:9101;
        server 127.0.0.1:9102;
    }

    upstream hc_root {              # health_check (default uri "/")
        zone hc_root 256k;
        server 127.0.0.1:9101;
        server 127.0.0.1:9102;
    }

    upstream hc_two {               # two checks: uri=/health and uri=/ready
        zone hc_two 256k;
        server 127.0.0.1:9101;
        server 127.0.0.1:9102;
    }

    upstream hc_admin {             # 9101 is down by configuration
        zone hc_admin 256k;
        server 127.0.0.1:9101 down;
        server 127.0.0.1:9102;
    }

    upstream hc_unchecked {         # no health_check: control group
        zone hc_unchecked 256k;
        server 127.0.0.1:9101;
        server 127.0.0.1:9102;
    }

    upstream hc_dns {               # servers come from DNS (dnsmasq)
        zone hc_dns 256k;
        resolver 127.0.0.1:5353 valid=1s ipv6=off;
        server dyn.test:9201 resolve max_fails=0;
    }

    upstream hc_srv {               # the SRV server is down by configuration
        zone hc_srv 256k;
        resolver 127.0.0.1:5353 valid=1s ipv6=off;
        server 127.0.0.1:9102;
        server srv.test service=http resolve down;
    }

    upstream hc_srv_up {            # no health_check: shows the SRV resolves
        zone hc_srv_up 256k;
        resolver 127.0.0.1:5353 valid=1s ipv6=off;
        server srv.test service=http resolve;
    }

    upstream hc_raw {               # socat, raw responses; 9102 if unhealthy
        zone hc_raw 256k;
        server 127.0.0.1:9301 max_fails=0;
        server 127.0.0.1:9102 backup;
    }

    upstream hc_raw11 {             # the same, probed with HTTP/1.1
        zone hc_raw11 256k;
        server 127.0.0.1:9301 max_fails=0;
        server 127.0.0.1:9102 backup;
    }

    upstream hc_slow {              # 9302 never answers
        zone hc_slow 256k;
        server 127.0.0.1:9302;
        server 127.0.0.1:9101;
    }

    upstream hc_h10 {               # probed with HTTP/1.0, which gets 426
        zone hc_h10 256k;
        server 127.0.0.1:9101;
    }

    upstream tls.test {             # https; 9402 if 9401 is unhealthy
        zone hc_tls 256k;
        server 127.0.0.1:9401 max_fails=0;
        server 127.0.0.1:9402 backup;
    }

    upstream wrong.test {           # https, certificate for another name
        zone hc_tls_name 256k;
        server 127.0.0.1:9402;
    }

    upstream hc_tls_ca {            # https, certificate from another CA
        zone hc_tls_ca 256k;
        server 127.0.0.1:9402;
    }

    match hc_raw_ok {               # the decoded body, not the chunks
        status 200;
        body ~ "^ok$";
    }

    match hc_ok {
        status 200;
        header Content-Type = text/plain;
        body ~ "^ok";
    }

    match hc_neg {                  # negative tests only
        status ! 500-599;
        header ! X-Maintenance;
        header Content-Type != text/html;
        body !~ "degraded";
    }

    # Not used by a check: makes `nginx -t` parse every test form.
    match hc_syntax {
        status ! 500;
        status 200 204;
        status ! 301 302;
        status 200-399;
        status ! 400-599;
        status 301-303 307;
        header Content-Type = application/json;
        header Content-Type != application/json;
        header Cache-Control ~ no-store;
        header Cache-Control !~ no-store;
        header Server;
        header ! X-Debug;
        body ~ "ready";
        body !~ "starting up";
    }

    # --- front end ------------------------------------------------------------

    server {
        listen 8082;

        location = /healthz {
            return 200 "ok\n";
        }

        location /default/ {
            proxy_pass http://hc_default/;
            health_check interval=1s uri=/health;
        }

        location /match/ {
            proxy_pass http://hc_match/;
            health_check interval=1s uri=/health match=hc_ok;
        }

        location /neg/ {
            proxy_pass http://hc_neg/;
            health_check interval=1s uri=/health match=hc_neg;
        }

        location /root/ {
            proxy_pass http://hc_root/;
            health_check interval=1s;
        }

        location /two/ {
            proxy_pass http://hc_two/;
            health_check interval=1s uri=/health;
        }

        location /two-ready/ {
            proxy_pass http://hc_two/;
            health_check interval=1s uri=/ready;
        }

        location /admin/ {
            proxy_pass http://hc_admin/;
            health_check interval=1s uri=/health;
        }

        location /unchecked/ {
            proxy_pass http://hc_unchecked/;
        }

        location /dns/ {
            proxy_pass http://hc_dns/;
            health_check interval=1s uri=/health;
        }

        location /srv/ {
            proxy_pass http://hc_srv/;
            health_check interval=1s uri=/health;
        }

        location /srv-up/ {
            proxy_pass http://hc_srv_up/;
        }

        location /raw/ {
            proxy_pass http://hc_raw/;
            proxy_http_version 1.0;
            proxy_buffer_size 1k;
            health_check interval=1s uri=/health;
        }

        location /raw11/ {
            proxy_pass http://hc_raw11/;
            health_check interval=1s uri=/health match=hc_raw_ok;
        }

        # Not requested: 9302 would hold the request. The timeouts differ
        # so that the probe of 9302 says which one ran out.
        location /slow/ {
            proxy_pass http://hc_slow/;
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 4s;
            health_check interval=1s uri=/health;
        }

        location /h10/ {
            proxy_pass http://hc_h10/;
            proxy_http_version 1.0;
            health_check interval=1s uri=/health11;
        }

        location /tls/ {
            proxy_pass https://tls.test/;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate certs/test-ca.crt;
            health_check interval=1s uri=/health11;
        }

        location /tls-name/ {
            proxy_pass https://wrong.test/;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate certs/test-ca.crt;
            health_check interval=1s uri=/health;
        }

        location /tls-ca/ {
            proxy_pass https://hc_tls_ca/;
            proxy_ssl_name tls.test;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate certs/other-ca.crt;
            health_check interval=1s uri=/health;
        }

        # One attempt per server the group counts as usable (peers->tries).
        location /flaky/ {
            proxy_next_upstream error timeout http_503;
            add_header X-Upstream-Status $upstream_status always;

            location /flaky/default/ {
                proxy_pass http://hc_default/flaky;
            }

            location /flaky/dns/ {
                proxy_pass http://hc_dns/flaky;
            }
        }
    }
}
