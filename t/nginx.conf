# Test configuration for t/test.sh.

load_module modules/ngx_http_health_check_module.so;

worker_processes 4;             # checks run in worker 0, the others must see them
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;

    # --- backends -----------------------------------------------------------
    # 127.0.0.1:9101 and :9102 answer "/" with their port; 127.0.0.1-3:9201
    # (the "resolve" group) with their address. That port or address is the
    # backend's key. Its /health answer is switched by files in /tmp/hc/:
    #   <key>.fail      503 "fail"
    #   <key>.degraded  200 "degraded"
    #   <key>.html      200 "ok" as text/html
    #   (none)          200 "ok" as text/plain
    # /flaky always answers 503, to count proxy_next_upstream attempts.

    map $server_port $hc_key {
        9201     $server_addr;
        default  $server_port;
    }

    server {
        listen 127.0.0.1:9101;
        listen 127.0.0.1:9102;
        listen 127.0.0.1:9201;
        listen 127.0.0.2:9201;
        listen 127.0.0.3:9201;
        default_type text/plain;

        location = /health {
            if (-f /tmp/hc/$hc_key.fail)     { return 503 "fail\n"; }
            if (-f /tmp/hc/$hc_key.degraded) { return 200 "degraded\n"; }
            if (-f /tmp/hc/$hc_key.html)     { rewrite ^ /health-html last; }
            return 200 "ok\n";
        }

        location = /health-html {
            internal;
            default_type text/html;
            return 200 "ok\n";
        }

        location = /flaky {
            return 503 "$hc_key\n";
        }

        location / {
            return 200 "$hc_key\n";
        }
    }

    # 127.0.0.4:9201 is the target of the SRV record _http._tcp.srv.test
    # (a.srv.test, from dnsmasq). It logs the /health requests it gets.
    server {
        listen 127.0.0.4:9201;
        default_type text/plain;

        location = /health {
            access_log /tmp/srv-health.log;
            return 200 "ok\n";
        }

        location / {
            return 200 "127.0.0.4\n";
        }
    }

    # 127.0.0.1:9301 is socat (see entrypoint.sh): every request gets the
    # bytes of /tmp/raw/resp, whatever they are.

    # --- groups ---------------------------------------------------------------
    # 256k: the zone minimum is above 64k on systems with 16k memory pages.

    # hc_default and hc_dns also serve /flaky/, whose 503s would trip the
    # passive checks (max_fails) and take servers out on their own.

    upstream hc_default {           # health_check uri=/health
        zone hc_default 256k;
        server 127.0.0.1:9101 max_fails=0;
        server 127.0.0.1:9102 max_fails=0;
    }

    upstream hc_match {             # health_check uri=/health match=hc_ok
        zone hc_match 256k;
        server 127.0.0.1:9101;
        server 127.0.0.1:9102;
    }

    upstream hc_root {              # health_check (default uri "/")
        zone hc_root 256k;
        server 127.0.0.1:9101;
        server 127.0.0.1:9102;
    }

    upstream hc_admin {             # 9101 is down by configuration
        zone hc_admin 256k;
        server 127.0.0.1:9101 down;
        server 127.0.0.1:9102;
    }

    upstream hc_unchecked {         # no health_check: control group
        zone hc_unchecked 256k;
        server 127.0.0.1:9101;
        server 127.0.0.1:9102;
    }

    upstream hc_dns {               # servers come from DNS (dnsmasq)
        zone hc_dns 256k;
        resolver 127.0.0.1:5353 valid=1s ipv6=off;
        server dyn.test:9201 resolve max_fails=0;
    }

    upstream hc_srv {               # the SRV server is down by configuration
        zone hc_srv 256k;
        resolver 127.0.0.1:5353 valid=1s ipv6=off;
        server 127.0.0.1:9102;
        server srv.test service=http resolve down;
    }

    upstream hc_srv_up {            # no health_check: shows the SRV resolves
        zone hc_srv_up 256k;
        resolver 127.0.0.1:5353 valid=1s ipv6=off;
        server srv.test service=http resolve;
    }

    upstream hc_raw {               # socat, raw responses; 9102 if unhealthy
        zone hc_raw 256k;
        server 127.0.0.1:9301 max_fails=0;
        server 127.0.0.1:9102 backup;
    }

    match hc_ok {
        status 200;
        header Content-Type = text/plain;
        body ~ "^ok";
    }

    # Not used by a check: makes `nginx -t` parse every test form.
    match hc_syntax {
        status ! 500;
        status 200 204;
        status ! 301 302;
        status 200-399;
        status ! 400-599;
        status 301-303 307;
        header Content-Type = application/json;
        header Content-Type != application/json;
        header Cache-Control ~ no-store;
        header Cache-Control !~ no-store;
        header Server;
        header ! X-Debug;
        body ~ "ready";
        body !~ "starting up";
    }

    # --- front end ------------------------------------------------------------

    server {
        listen 8082;

        location = /healthz {
            return 200 "ok\n";
        }

        location /default/ {
            proxy_pass http://hc_default/;
            health_check interval=1s uri=/health;
        }

        location /match/ {
            proxy_pass http://hc_match/;
            health_check interval=1s uri=/health match=hc_ok;
        }

        location /root/ {
            proxy_pass http://hc_root/;
            health_check interval=1s;
        }

        location /admin/ {
            proxy_pass http://hc_admin/;
            health_check interval=1s uri=/health;
        }

        location /unchecked/ {
            proxy_pass http://hc_unchecked/;
        }

        location /dns/ {
            proxy_pass http://hc_dns/;
            health_check interval=1s uri=/health;
        }

        location /srv/ {
            proxy_pass http://hc_srv/;
            health_check interval=1s uri=/health;
        }

        location /srv-up/ {
            proxy_pass http://hc_srv_up/;
        }

        location /raw/ {
            proxy_pass http://hc_raw/;
            health_check interval=1s uri=/health;
        }

        # One attempt per server the group counts as usable (peers->tries).
        location /flaky/ {
            proxy_next_upstream error timeout http_503;
            add_header X-Upstream-Status $upstream_status always;

            location /flaky/default/ {
                proxy_pass http://hc_default/flaky;
            }

            location /flaky/dns/ {
                proxy_pass http://hc_dns/flaky;
            }
        }
    }
}
